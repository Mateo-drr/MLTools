name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      # known-failing: 6.5/10, remove continue-on-error once clean
      - name: Pylint
        continue-on-error: true
        run: pylint mltools

      # known-failing: 151 strict errors, remove continue-on-error once clean
      - name: Mypy
        continue-on-error: true
        run: mypy

      - name: Pytest
        run: pytest